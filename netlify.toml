# Netlify publica este repo tal cual desde GitHub (ait-paginas/boxer-gestion-web, rama main).
# En Netlify: Base directory vacio, Build command vacio, Publish directory = "."
# Es HTML estatico: no hay paso de build.
[build]
  publish = "."

# Archivos internos del repo (proceso de Claude, chequeos, documentacion): no se
# sirven en la web. No tienen secretos, pero no son para el publico.
[[redirects]]
  from = "/scripts/*"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/CLAUDE.md"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/"
  status = 404
  force = true
